<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prime Number Checker</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #e9f2ff, #f6edff); color: #172033;
    }
    .card {
      width: min(100%, 460px); padding: 34px; border-radius: 20px;
      background: white; box-shadow: 0 18px 50px rgba(35, 55, 90, .13);
    }
    h1 { margin: 0 0 8px; font-size: 28px; }
    .sub { color: #64748b; margin: 0 0 26px; line-height: 1.5; }
    label { display: block; margin-bottom: 8px; font-weight: 700; }
    input {
      width: 100%; padding: 14px; border: 1px solid #cbd5e1;
      border-radius: 10px; font-size: 17px; outline: none;
    }
    input:focus { border-color: #526fe8; box-shadow: 0 0 0 3px #526fe822; }
    button {
      width: 100%; margin-top: 16px; padding: 14px; border: 0;
      border-radius: 10px; background: #425fe5; color: white;
      font-size: 16px; font-weight: 700; cursor: pointer;
    }
    button:hover { background: #304bd0; }
    #result {
      display: none; margin-top: 20px; padding: 16px; border-radius: 10px;
      background: #eef2ff; line-height: 1.5; font-weight: 700;
    }
    #result.error { background: #fff1f2; color: #be123c; }
    .foot { margin-top: 22px; color: #94a3b8; font-size: 12px; text-align: center; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Prime Number Checker</h1>
    <p class="sub">Enter a whole number and check whether it is prime.</p>
    <form id="primeForm">
      <label for="number">Enter a number</label>
      <input id="number" name="number" type="number" step="1" required placeholder="Example: 7">
      <button type="submit">Check Number</button>
    </form>
    <div id="result" role="status" aria-live="polite"></div>
    <div class="foot">Java · Docker · Jenkins · Kubernetes</div>
  </main>
  <script>
    const form = document.getElementById('primeForm');
    const result = document.getElementById('result');
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const number = document.getElementById('number').value.trim();
      result.style.display = 'block';
      result.className = '';
      result.textContent = 'Checking...';
      try {
        const response = await fetch('/api/prime?number=' + encodeURIComponent(number));
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Request failed');
        result.textContent = data.message;
      } catch (error) {
        result.className = 'error';
        result.textContent = error.message;
      }
    });
  </script>
</body>
</html>
