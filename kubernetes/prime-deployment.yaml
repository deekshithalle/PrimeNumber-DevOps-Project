apiVersion: apps/v1
kind: Deployment
metadata:
  name: prime-number-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prime-number-web
  template:
    metadata:
      labels:
        app: prime-number-web
    spec:
      containers:
        - name: prime-number-web
          image: prime-number-web:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: prime-number-service
spec:
  type: NodePort
  selector:
    app: prime-number-web
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30084
